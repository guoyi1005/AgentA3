name: Seed Campus Activities

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - deploy/seed-campus-activities.sql
      - deploy/campus-activity-images.tar.gz
      - deploy/import-campus-activities.sh
      - .github/workflows/seed-campus-activities.yml

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      REPO_DIR: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Seed Campus Activities On Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: REPO_DIR,DEPLOY_BRANCH
          script: |
            cd "$REPO_DIR"
            git fetch origin "$DEPLOY_BRANCH"
            git checkout -f -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            bash deploy/import-campus-activities.sh